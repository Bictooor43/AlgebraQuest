<!DOCTYPE html>
<html lang="ro">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasa a 11-a</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="main.js"></script>

</head>

<body class="bg-[#1e1e1e] text-slate-200 min-h-screen flex flex-col justify-between font-sans">

    <header class="bg-[#1e1e1e] border border-[#2c2c2c] p-6 text-center">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider">
            <a href="index.html" class="hover:opacity-80 transition-opacity">
                <span class="text-cyan-400">Algebra</span><span class="text-emerald-400">Quest</span>
            </a>
        </h1>
        <p class="text-sm text-slate-200 mt-1">Noțiuni teoretice și practice pentru învățarea <strong>algebrei liniare</strong></p>
    </header>

    <nav class="bg-[#161616] border-b border-[#2c2c2c] p-4 flex justify-center gap-3 overflow-x-auto">
        <button onclick="switchTab('teorie')" id="tab-teorie" class="tab-btn bg-[#1e1e1e] border border-cyan-500 text-cyan-400 px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition duration-300">Teorie</button>
        <button onclick="switchTab('calculator')" id="tab-calculator" class="tab-btn bg-[#1e1e1e] border border-[#2c2c2c] text-[#9ca3af] hover:border-cyan-500 hover:text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition duration-300">Calculator</button>
        <button onclick="switchTab('vizualizare')" id="tab-vizualizare" class="tab-btn bg-[#1e1e1e] border border-[#2c2c2c] text-[#9ca3af] hover:border-cyan-500 hover:text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition duration-300">Vizualizare</button>

    </nav>

    <main class="container mx-auto px-4 py-8 flex-grow max-w-4xl">
        <section id="sec-teorie" class="tab-content space-y-4">
            <h2>Test1</h2>
        </section>
        <section id="sec-calculator" class="tab-content hidden space-y-4">
            <h2>Test2</h2>
        </section>
        <section id="sec-vizualizare" class="tab-content hidden space-y-4">
            <h2>Test3</h2>
        </section>
    </main>

    <footer class="border-t border-[#2c2c2c] py-4 text-center text-xs text-slate-200">
        Proiect de atestat în informatică &bull; Realizat de elevul Ciubotariu Victor-Sebastian &bull; Clasa a XII-a F &bull; An școlar 2026-2027
    </footer>

</body>
</html>
